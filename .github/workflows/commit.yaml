name: build
on:
  push:
    branches: [develop, master]
  pull_request:
permissions:
  contents: read

jobs:
  linters:
    name: linters
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: "0.13.9"
          python-version: '3.13'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run ruff check
        run: uv run --locked ruff check .

      - name: Run ruff format
        run: uv run --locked ruff format --check .

      - name: Run type checker
        run: |
          uv run --locked mypy --version
          uv run --locked mypy -p napalm --config-file mypy.ini

      - name: Run dependency vulnerability audit
        run: uv audit --locked --preview-features audit-command

  std_tests:
    name: std_tests
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
        platform: [ubuntu-24.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: "0.13.9"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Tests
        run: uv run --locked pytest --cov=napalm --cov-report term-missing -vs

  std_tests_macos_intel:
    name: std_tests_macos_intel
    strategy:
      matrix:
        python-version: ['3.13']
        platform: [macos-15-intel]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: "0.13.9"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Tests
        run: uv run --locked pytest --cov=napalm --cov-report term-missing -vs

  std_tests_macos:
    name: std_tests_macos
    strategy:
      matrix:
        python-version: ['3.11', '3.15']
        platform: [macos-26]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: "0.13.9"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Tests
        run: uv run --locked pytest --cov=napalm --cov-report term-missing -vs

  build_docs:
    name: build_docs
    needs: std_tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: "0.13.9"
          python-version: '3.13'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Doctests
        run: uv run --locked make doctest
